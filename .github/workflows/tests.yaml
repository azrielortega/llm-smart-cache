name: tests

on: pull_request

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only what the tests import: conftest.py stubs sentence-transformers, so torch isn't needed.
      - run: pip install numpy faiss-cpu python-dotenv pytest
      - run: pytest
